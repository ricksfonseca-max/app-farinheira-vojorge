server {
    listen 3000;
    root /usr/share/nginx/html;

    # DNS interno do Docker: resolve o nome do serviço na hora da requisição,
    # assim o app sobe mesmo se o servico-umidade ainda não estiver no ar.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Serviço Python de sugestão de rotação (mesma rede Docker).
    location /umidade-api/ {
        set $servico_umidade http://servico-umidade:8000;
        rewrite ^/umidade-api/(.*)$ /$1 break;
        proxy_pass $servico_umidade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
    }

    # Arquivos com hash no nome (gerados pelo build): podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html: o navegador e o Cloudflare sempre conferem se há versão nova.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
